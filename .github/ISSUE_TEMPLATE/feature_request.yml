name: Feature request
description: Suggest an idea or a new capability for the MQL language server
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you are trying
        to solve, not only the solution you have in mind.

  - type: dropdown
    id: language
    attributes:
      label: Affected language
      options:
        - MQL4
        - MQL5
        - Both
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: |
        What are you trying to do, and what gets in the way? Concrete
        scenarios are more useful than abstract descriptions.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or considered, including existing tooling or workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links to MQL documentation, editor capabilities, prior art from other language servers.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for a duplicate
          required: true