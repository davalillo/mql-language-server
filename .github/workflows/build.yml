name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para release (ej. v1.0.17)'
        required: false
        default: 'manual-run'

permissions:
  contents: write
  actions: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  get-effective-tag:
    name: Get effective tag
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.set-tag.outputs.effective_tag }}
      is_tag_trigger: ${{ steps.set-tag.outputs.is_tag_trigger }}
    steps:
      - name: Set effective tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag || 'manual-run' }}"
            IS_TAG_TRIGGER="false"
          else
            TAG="${{ github.ref_name }}"
            IS_TAG_TRIGGER="true"
          fi
          echo "effective_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_tag_trigger=$IS_TAG_TRIGGER" >> $GITHUB_OUTPUT

  publish-binaries:
    name: Publish all platforms
    needs: get-effective-tag
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    outputs:
      tag: ${{ needs.get-effective-tag.outputs.effective_tag }}
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Fail the release if the pushed tag does not match the package version in the csproj,
      # preventing a mismatched tag/package pair from being published.
      - name: Verify tag matches package version
        run: |
          CS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/MqlLanguageServer.Server.csproj | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$CS_VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match csproj version '$CS_VERSION'."
            echo "::error::Update <Version> in src/MqlLanguageServer.Server.csproj to '$TAG_VERSION' and tag again."
            exit 1
          fi
          echo "Tag matches package version: $CS_VERSION"

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          # Skip performance tests in CI (they're flaky due to timing variations in GitHub Actions workers)
          # Use CI environment variable set by GitHub Actions
          echo "Running tests excluding Performance folder..."
          dotnet test --no-build -c Release --filter "FullyQualifiedName!~Performance"

      # CAMBIO IMPORTANTE: Renombramos los archivos al publicarlos para que no se llamen igual
      - name: Publish & Rename Binaries
        run: |
          platforms=("linux-x64" "osx-x64" "osx-arm64" "win-x64")
          outputs=("linux" "osx-x64" "osx-arm64" "win")
          names=("mql-lsp-server-linux-x64" "mql-lsp-server-osx-x64" "mql-lsp-server-osx-arm64" "mql-lsp-server-win-x64.exe")
          
          for i in "${!platforms[@]}"; do
            rid="${platforms[$i]}"
            out_dir="${outputs[$i]}"
            final_name="${names[$i]}"
            
            echo "Building $rid → $final_name"
            
            dotnet publish src/MqlLanguageServer.Server.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None -p:DebugSymbols=false \
              --output "bin_temp/$out_dir"
            
            mkdir -p bin
            if [[ "$rid" == win-x64 ]]; then
              mv "bin_temp/$out_dir/mql-lsp-server.exe" "bin/$final_name"
            else
              mv "bin_temp/$out_dir/mql-lsp-server" "bin/$final_name"
            fi
          done
    
          chmod +x bin/mql-lsp-server-*  

      - name: Generate CHECKSUMS.txt
        run: |
          cd bin
          # Generate checksums with header
          echo "# SHA256 checksums for ${{ needs.get-effective-tag.outputs.effective_tag }}" > CHECKSUMS.txt
          echo "# Generated: $(date -u '+%Y-%m-%d')" >> CHECKSUMS.txt
          echo "" >> CHECKSUMS.txt
          find . -type f -name "mql-lsp-server-*" -exec sha256sum {} \; >> CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/MqlLanguageServer.Server.csproj -c Release --no-build --output nupkg/

      - name: Cleanup old artifacts BEFORE upload
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // Keep only artifacts from current release
            const keepVersions = ['${{ needs.get-effective-tag.outputs.effective_tag }}'];
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      # - name: Upload artifacts
      #   if: ${{ !env.ACT && !github.event.act }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: binaries-${{ needs.get-effective-tag.outputs.effective_tag }}
      #     path: |
      #       bin/
      #       nupkg/
      #     retention-days: 1  # Auto-delete after 1 day

      - name: Create/Update release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.get-effective-tag.outputs.effective_tag }}
          name: "${{ needs.get-effective-tag.outputs.effective_tag }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ needs.get-effective-tag.outputs.effective_tag }}.

            ### Archivos disponibles:
            - **Windows:** `mql-lsp-server-win-x64.exe`
            - **Linux:** `mql-lsp-server-linux-x64`
            - **macOS (Intel):** `mql-lsp-server-osx-x64`
            - **macOS (M1/M2/M3):** `mql-lsp-server-osx-arm64`
            - **Checksums:** `CHECKSUMS.txt` (verifica integridad de archivos)

            _El código fuente adjunto abajo (Source code zip) contiene el código completo de este repositorio._

            ### Verificación de integridad:
            ```bash
            sha256sum -c CHECKSUMS.txt
            ```
          files: |
            bin/mql-lsp-server-linux-x64
            bin/mql-lsp-server-osx-x64
            bin/mql-lsp-server-osx-arm64
            bin/mql-lsp-server-win-x64.exe
            bin/CHECKSUMS.txt
            nupkg/*.nupkg
          draft: false
          prerelease: ${{ contains(needs.get-effective-tag.outputs.effective_tag, '-') }}
          make_latest: ${{ !contains(needs.get-effective-tag.outputs.effective_tag, '-') }}

      - name: Cleanup old artifacts
        uses: actions/github-script@v9
        with:
          script: |
            // Get the 2 most recent releases
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            });

            // Extract tag names from the 2 latest releases
            const keepVersions = releases.data.map(r => r.tag_name);

            // Also add current tag if it's a new release (not in releases list yet)
            const currentTag = '${{ needs.get-effective-tag.outputs.effective_tag }}';
            if (!keepVersions.includes(currentTag)) {
              keepVersions.push(currentTag);
            }

            console.log('Keeping artifacts for versions:', keepVersions);

            // Get all artifacts
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Delete artifacts that don't match the keep versions
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting artifact: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }