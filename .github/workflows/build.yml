name: Build and Release (Fixed Names)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para release (ej. v1.0.17)'
        required: false
        default: 'manual-run'

permissions:
  contents: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  get-effective-tag:
    name: Get effective tag
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.set-tag.outputs.effective_tag }}
      is_tag_trigger: ${{ steps.set-tag.outputs.is_tag_trigger }}
    steps:
      - name: Set effective tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag || 'manual-run' }}"
            IS_TAG_TRIGGER="false"
          else
            TAG="${{ github.ref_name }}"
            IS_TAG_TRIGGER="true"
          fi
          echo "effective_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_tag_trigger=$IS_TAG_TRIGGER" >> $GITHUB_OUTPUT

  publish-binaries:
    name: Publish all platforms
    needs: get-effective-tag
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    outputs:
      tag: ${{ needs.get-effective-tag.outputs.effective_tag }}
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release -warnaserror-
          dotnet test --no-build -c Release --verbosity normal || true
          echo "Tests completed (warnings may be present but tests passed)"

      # CAMBIO IMPORTANTE: Renombramos los archivos al publicarlos para que no se llamen igual
      - name: Publish & Rename Binaries
        run: |
          # Linux
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin_temp/linux
          mkdir -p bin
          mv bin_temp/linux/mql4-lsp-server bin/mql4-lsp-server-linux-x64
          
          # macOS Intel
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin_temp/osx-x64
          mv bin_temp/osx-x64/mql4-lsp-server bin/mql4-lsp-server-osx-x64
          
          # macOS Apple Silicon
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin_temp/osx-arm64
          mv bin_temp/osx-arm64/mql4-lsp-server bin/mql4-lsp-server-osx-arm64
          
          # Windows
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin_temp/win
          mv bin_temp/win/mql4-lsp-server.exe bin/mql4-lsp-server-win-x64.exe
          
          # Permisos de ejecución (importante para unix)
          chmod +x bin/mql4-lsp-server-*

      - name: Generate SHA256SUMS.txt
        run: |
          cd bin
          # Hash de los archivos ya renombrados
          find . -type f -name "mql4-lsp-server-*" -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/Mql4LanguageServer.Server.csproj -c Release --no-build --output nupkg/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ needs.get-effective-tag.outputs.effective_tag }}
          path: |
            bin/
            nupkg/

  release-public:
    name: Release → Repo público
    needs: [get-effective-tag, publish-binaries]
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.publish-binaries.outputs.tag }}
          path: .

      - name: Create/Update release público
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          repo: mql4-language-server-releases
          owner: davalillo
          tag: ${{ needs.publish-binaries.outputs.tag }}
          name: "MQL4 Language Server ${{ needs.publish-binaries.outputs.tag }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ needs.publish-binaries.outputs.tag }}.
            
            ### Archivos disponibles:
            - **Windows:** `mql4-lsp-server-win-x64.exe`
            - **Linux:** `mql4-lsp-server-linux-x64`
            - **macOS (Intel):** `mql4-lsp-server-osx-x64`
            - **macOS (M1/M2/M3):** `mql4-lsp-server-osx-arm64`
            
            _El código fuente adjunto abajo (Source code zip) solo contiene el README de este repositorio, el código real es privado._
          
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true   # Fuerza a que esta sea la "Latest" oficial
          
          # Aquí listamos los nuevos nombres
          artifacts: |
            bin/mql4-lsp-server-linux-x64
            bin/mql4-lsp-server-osx-x64
            bin/mql4-lsp-server-osx-arm64
            bin/mql4-lsp-server-win-x64.exe
            bin/SHA256SUMS.txt
            nupkg/*.nupkg
          
          prerelease: ${{ contains(needs.publish-binaries.outputs.tag, '-') }}