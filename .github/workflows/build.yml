# .github/workflows/build.yml
# VERSIÓN FINAL – MANUAL FUNCIONA PERFECTO (2025)
# - Ejecuta en dispatch si tag 'v*' (incluyendo private para pruebas)
# - No más skips innecesarios ni errores 422
# - Debug: Logs en skipped jobs

name: Build and Release (granular + dispatch)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # MANUAL: Aparece "Run workflow" en Actions tab
    inputs:
      tag:  # Input para simular tag en runs manuales
        description: 'Tag para release (ej. v1.0.17) – deja vacío para run de prueba'
        required: false
        default: 'manual-run'  # Default no-v-tag para pruebas sin release

permissions:
  contents: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  get-effective-tag:
    name: Get effective tag
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.set-tag.outputs.effective_tag }}
      is_tag_trigger: ${{ steps.set-tag.outputs.is_tag_trigger }}
    steps:
      - name: Set effective tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag || 'manual-run' }}"
            IS_TAG_TRIGGER="false"
          else
            TAG="${{ github.ref_name }}"
            IS_TAG_TRIGGER="true"
          fi
          echo "effective_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_tag_trigger=$IS_TAG_TRIGGER" >> $GITHUB_OUTPUT
          echo "DEBUG: Event name: ${{ github.event_name }}"
          echo "DEBUG: Using tag: $TAG"
          echo "DEBUG: Is real tag trigger? $IS_TAG_TRIGGER"

  publish-binaries:
    name: Publish all platforms
    needs: get-effective-tag
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    outputs:
      tag: ${{ needs.get-effective-tag.outputs.effective_tag }}
    steps:
      - name: Debug skip reason
        if: skipped()
        run: echo "DEBUG: Skipped because not tag trigger and tag not v*"

      - name: Checkout (privado)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --verbosity normal

      - name: Publish Linux/macOS/Windows + Apple Silicon
        run: |
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r linux-x64   --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/linux-x64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-x64     --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/osx-x64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-arm64  --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/osx-arm64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r win-x64    --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/win-x64
          chmod +x bin/linux-x64/mql4-lsp-server bin/osx-*/mql4-lsp-server

      - name: Generate SHA256SUMS.txt
        run: |
          cd bin
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/Mql4LanguageServer.Server.csproj -c Release --no-build --output nupkg/

      - name: Upload artifacts (para debug/re-run granular)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ needs.get-effective-tag.outputs.effective_tag }}
          path: |
            bin/
            nupkg/

  release-private:
    name: Release → Repo privado (opcional)
    needs: [get-effective-tag, publish-binaries]
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    steps:
      - name: Debug skip reason
        if: skipped()
        run: echo "DEBUG: Skipped because not tag trigger and tag not v*"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.publish-binaries.outputs.tag }}
          path: .

      - name: Create/Update release (privado) – sin warnings
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ needs.publish-binaries.outputs.tag }}
          name: "MQL4 Language Server ${{ needs.publish-binaries.outputs.tag }}"
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: |
            bin/linux-x64/mql4-lsp-server
            bin/osx-x64/mql4-lsp-server
            bin/osx-arm64/mql4-lsp-server
            bin/win-x64/mql4-lsp-server.exe
            bin/SHA256SUMS.txt
            nupkg/*.nupkg

  release-public:
    name: Release → Repo público (davalillo/mql4-language-server-releases)
    needs: [get-effective-tag, publish-binaries]
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    steps:
      - name: Debug skip reason
        if: skipped()
        run: echo "DEBUG: Skipped because not tag trigger and tag not v*"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.publish-binaries.outputs.tag }}
          path: .

      - name: Create/Update release público – 100% infalible
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}

          repo: mql4-language-server-releases
          owner: davalillo

          tag: ${{ needs.publish-binaries.outputs.tag }}
          name: "MQL4 Language Server ${{ needs.publish-binaries.outputs.tag }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ needs.publish-binaries.outputs.tag }}.

            Verifica integridad con SHA256SUMS.txt

          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          skipIfReleaseExists: false

          artifacts: |
            bin/linux-x64/mql4-lsp-server
            bin/osx-x64/mql4-lsp-server
            bin/osx-arm64/mql4-lsp-server
            bin/win-x64/mql4-lsp-server.exe
            bin/SHA256SUMS.txt
            nupkg/*.nupkg

          prerelease: ${{ contains(needs.publish-binaries.outputs.tag, '-') }}

      - name: Success message
        if: success()
        run: |
          echo "¡Release público listo!"
          echo "https://github.com/davalillo/mql4-language-server-releases/releases/tag/${{ needs.publish-binaries.outputs.tag }}"