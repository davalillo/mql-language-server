name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger:"trx;LogFileName=tests-results.trx"
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Test-results-${{ matrix.os }}
        path: TestResults/*.trx
        retention-days: 30

  publish:
    name: Publish standalone binaries
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Linux x64
      run: dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o bin/linux-x64/

    - name: Build macOS x64
      run: dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o bin/osx-x64/

    - name: Build Windows x64
      run: dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o bin/win-x64/

    - name: Make Linux binary executable
      run: chmod +x bin/linux-x64/mql4-lsp-server

    - name: Make macOS binary executable
      run: chmod +x bin/osx-x64/mql4-lsp-server

    - name: Create NuGet package
      run: dotnet pack src/Mql4LanguageServer.Server.csproj -c Release -o nupkg/

    - name: Upload binaries artifact
      uses: actions/upload-artifact@v4
      with:
        name: mql4-lsp-binaries-${{ github.sha }}
        path: |
          bin/linux-x64/mql4-lsp-server
          bin/osx-x64/mql4-lsp-server
          bin/win-x64/mql4-lsp-server.exe
        retention-days: 90

    - name: Upload NuGet package artifact
      uses: actions/upload-artifact@v4
      with:
        name: mql4-lsp-nupkg-${{ github.sha }}
        path: nupkg/*.nupkg
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        RELEASE_NAME="MQL4 Language Server v$VERSION"

        # Calculate checksums
        (cd bin && sha256sum linux-x64/mql4-lsp-server > SHA256SUMS.txt)
        (cd bin && sha256sum osx-x64/mql4-lsp-server >> SHA256SUMS.txt)
        (cd bin && sha256sum win-x64/mql4-lsp-server.exe >> SHA256SUMS.txt)

        # TODO: Create release with assets
        # gh release create $VERSION \
        #   --title "$RELEASE_NAME" \
        #   --notes-file RELEASE_NOTES.md \
        #   --latest \
        #   bin/linux-x64/mql4-lsp-server \
        #   bin/osx-x64/mql4-lsp-server \
        #   bin/win-x64/mql4-lsp-server.exe \
        #   nupkg/*.nupkg \
        #   bin/SHA256SUMS.txt
      shell: bash

  test-binaries:
    name: Test ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Linux binary
      if: matrix.os == 'ubuntu-latest'
      uses: actions/download-artifact@v4
      with:
        name: mql4-lsp-binaries-${{ github.sha }}
        path: ./

    - name: Download macOS binary
      if: matrix.os == 'macos-latest'
      uses: actions/download-artifact@v4
      with:
        name: mql4-lsp-binaries-${{ github.sha }}
        path: ./

    - name: Download Windows binary
      if: matrix.os == 'windows-latest'
      uses: actions/download-artifact@v4
      with:
        name: mql4-lsp-binaries-${{ github.sha }}
        path: ./

    - name: Make binary executable (Unix)
      if: matrix.os == 'ubuntu-latest'
      run: chmod +x bin/linux-x64/mql4-lsp-server

    - name: Make binary executable (macOS)
      if: matrix.os == 'macos-latest'
      run: chmod +x bin/osx-x64/mql4-lsp-server

    - name: Test Linux binary execution
      if: matrix.os == 'ubuntu-latest'
      run: timeout 3 ./bin/linux-x64/mql4-lsp-server --help || timeout 3 ./bin/linux-x64/mql4-lsp-server --stdio || true
      shell: bash

    - name: Test macOS binary execution
      if: matrix.os == 'macos-latest'
      run: timeout 3 ./bin/osx-x64/mql4-lsp-server --help || timeout 3 ./bin/osx-x64/mql4-lsp-server --stdio || true
      shell: bash

    - name: Verify binary info
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          file bin/win-x64/mql4-lsp-server.exe
          ls -lh bin/win-x64/mql4-lsp-server.exe
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          file bin/linux-x64/mql4-lsp-server
          ls -lh bin/linux-x64/mql4-lsp-server
        else
          file bin/osx-x64/mql4-lsp-server
          ls -lh bin/osx-x64/mql4-lsp-server
        fi
      shell: bash
