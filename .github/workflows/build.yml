name: Build and Release (Fixed Names)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para release (ej. v1.0.17)'
        required: false
        default: 'manual-run'

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  get-effective-tag:
    name: Get effective tag
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.set-tag.outputs.effective_tag }}
      is_tag_trigger: ${{ steps.set-tag.outputs.is_tag_trigger }}
    steps:
      - name: Set effective tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag || 'manual-run' }}"
            IS_TAG_TRIGGER="false"
          else
            TAG="${{ github.ref_name }}"
            IS_TAG_TRIGGER="true"
          fi
          echo "effective_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_tag_trigger=$IS_TAG_TRIGGER" >> $GITHUB_OUTPUT

  publish-binaries:
    name: Publish all platforms
    needs: get-effective-tag
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    outputs:
      tag: ${{ needs.get-effective-tag.outputs.effective_tag }}
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --verbosity normal

      # CAMBIO IMPORTANTE: Renombramos los archivos al publicarlos para que no se llamen igual
      - name: Publish & Rename Binaries
        run: |
          platforms=("linux-x64" "osx-x64" "osx-arm64" "win-x64")
          outputs=("linux" "osx-x64" "osx-arm64" "win")
          names=("mql4-lsp-server-linux-x64" "mql4-lsp-server-osx-x64" "mql4-lsp-server-osx-arm64" "mql4-lsp-server-win-x64.exe")
          
          for i in "${!platforms[@]}"; do
            rid="${platforms[$i]}"
            out_dir="${outputs[$i]}"
            final_name="${names[$i]}"
            
            echo "Building $rid → $final_name"
            
            dotnet publish src/Mql4LanguageServer.Server.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None -p:DebugSymbols=false \
              --output "bin_temp/$out_dir"
            
            mkdir -p bin
            if [[ "$rid" == win-x64 ]]; then
              mv "bin_temp/$out_dir/mql4-lsp-server.exe" "bin/$final_name"
            else
              mv "bin_temp/$out_dir/mql4-lsp-server" "bin/$final_name"
            fi
          done
    
          chmod +x bin/mql4-lsp-server-*  

      - name: Generate CHECKSUMS.txt
        run: |
          cd bin
          # Generate checksums with header
          echo "# SHA256 checksums for ${{ needs.get-effective-tag.outputs.effective_tag }}" > CHECKSUMS.txt
          echo "# Generated: $(date -u '+%Y-%m-%d')" >> CHECKSUMS.txt
          echo "" >> CHECKSUMS.txt
          find . -type f -name "mql4-lsp-server-*" -exec sha256sum {} \; >> CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/Mql4LanguageServer.Server.csproj -c Release --no-build --output nupkg/

      - name: Cleanup old artifacts BEFORE upload
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // Keep only artifacts from current release
            const keepVersions = ['${{ needs.get-effective-tag.outputs.effective_tag }}'];
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: Upload artifacts
        if: ${{ !env.ACT && !github.event.act }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ needs.get-effective-tag.outputs.effective_tag }}
          path: |
            bin/
            nupkg/
          retention-days: 1  # Auto-delete after 1 day

      - name: Create/Update release público
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          repository: davalillo/mql4-language-server-releases
          tag_name: ${{ needs.get-effective-tag.outputs.effective_tag }}
          name: "MQL4 Language Server ${{ needs.get-effective-tag.outputs.effective_tag }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ needs.get-effective-tag.outputs.effective_tag }}.

            ### Archivos disponibles:
            - **Windows:** `mql4-lsp-server-win-x64.exe`
            - **Linux:** `mql4-lsp-server-linux-x64`
            - **macOS (Intel):** `mql4-lsp-server-osx-x64`
            - **macOS (M1/M2/M3):** `mql4-lsp-server-osx-arm64`
            - **Checksums:** `CHECKSUMS.txt` (verifica integridad de archivos)

            _El código fuente adjunto abajo (Source code zip) solo contiene el README de este repositorio, el código real es privado._

            ### Verificación de integridad:
            ```bash
            sha256sum -c CHECKSUMS.txt
            ```
          files: |
            bin/mql4-lsp-server-linux-x64
            bin/mql4-lsp-server-osx-x64
            bin/mql4-lsp-server-osx-arm64
            bin/mql4-lsp-server-win-x64.exe
            bin/CHECKSUMS.txt
            nupkg/*.nupkg
          draft: false
          prerelease: ${{ contains(needs.get-effective-tag.outputs.effective_tag, '-') }}
          make_latest: true

      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // Keep only artifacts from last 3 releases
            const keepVersions = ['v1.7.0', 'v1.6.0', 'v1.5.0'];
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting artifact: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }