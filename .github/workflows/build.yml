# .github/workflows/release.yml
# VERSIÓN MÁS ROBUSTA 2025 – usa ncipollo/release-action
# → Nunca falla por "release already exists" ni por re-runs
# → Solo necesitas UN secret (PUBLIC_RELEASES_TOKEN)

# Crear el token (sí, necesitas uno):
# https://github.com/settings/tokens/new
# Tipo: Classic token
# Scopes: solo public_repo repo (o solo repo si el repo es público)
# Nombre: da igual
# Caducidad: 90 días o más

# Añadirlo como secret en el repo privado:
# Settings → Secrets and variables → Actions
# New repository secret
# Name: PUBLIC_RELEASES_TOKEN ← exactamente este nombre
# Value: pega el token

name: Build and Release (ultra-robust)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout (privado)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release

      # Publicar todos los binarios standalone single-file
      - name: Publish all platforms
        run: |
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r linux-x64   --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/linux-x64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-x64     --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/osx-x64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r osx-arm64  --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/osx-arm64
          dotnet publish src/Mql4LanguageServer.Server.csproj -c Release -r win-x64    --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output bin/win-x64
          chmod +x bin/linux-x64/mql4-lsp-server bin/osx-*/mql4-lsp-server

      - name: Generate SHA256 checksums
        run: |
          cd bin
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/Mql4LanguageServer.Server.csproj -c Release --no-build --output nupkg/

      # ===============================================
      # RELEASE EN REPO PRIVADO (opcional – puedes borrarlo)
      # ===============================================
      - name: Release en repo privado (opcional)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "MQL4 Language Server ${{ github.ref_name }}"
          generateReleaseNotes: true
          artifacts: |
            bin/linux-x64/mql4-lsp-server
            bin/osx-x64/mql4-lsp-server
            bin/osx-arm64/mql4-lsp-server
            bin/win-x64/mql4-lsp-server.exe
            bin/SHA256SUMS.txt
            nupkg/*.nupkg
          allowUpdates: true
          token: ${{ github.token }}

      # ===============================================
      # MIRROR PÚBLICO – LA OPCIÓN MÁS ROBUSTA
      # ===============================================
      - name: Mirror → repo público (infalible)
        uses: ncipollo/release-action@v1
        with:
          # Token que tiene permiso de escritura solo en el repo público
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}

          # Repo destino
          repo: mql4-language-server-releases
          owner: davalillo

          # Tag y título
          tag: ${{ github.ref_name }}
          name: "MQL4 Language Server ${{ github.ref_name }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ github.ref_name }}

            Verifica integridad con SHA256SUMS.txt

          # Comportamiento perfecto
          allowUpdates: true      # Actualiza si ya existe
          removeArtifacts: false  # No borra assets antiguos
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false

          # Lista de archivos a subir
          artifacts: |
            bin/linux-x64/mql4-lsp-server
            bin/osx-x64/mql4-lsp-server
            bin/osx-arm64/mql4-lsp-server
            bin/win-x64/mql4-lsp-server.exe
            bin/SHA256SUMS.txt
            nupkg/*.nupkg

          # Opcional: marcar como prerelease si el tag contiene -
          prerelease: ${{ contains(github.ref_name, '-') }}